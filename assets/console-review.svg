<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img"><rect width="1280" height="620" rx="32" fill="#07172b"/><style>.k{font:700 14px Arial;letter-spacing:2px;fill:#7dd3fc}.h{font:800 28px Arial;fill:#fff}.s{font:500 17px Arial;fill:#dbeafe}.b{font:700 14px Arial;fill:#fff}</style><text x="60" y="62" class="k">IAAP CONSOLE · VERIFIED EVIDENCE & HUMAN REVIEW</text><g transform="translate(60 125)"><rect width="230" height="190" rx="24" fill="#0d2438" stroke="#38bdf8" stroke-width="2"/><text x="28" y="52" class="h">Guard Evidence</text><text x="28" y="96" class="s">pinned producer</text><text x="28" y="128" class="s">versioned evidence</text><text x="28" y="160" class="s">source digest</text></g><text x="310" y="230" class="h">→</text><g transform="translate(350 125)"><rect width="230" height="190" rx="24" fill="#33240d" stroke="#f59e0b" stroke-width="2"/><text x="28" y="52" class="h">Verify</text><text x="28" y="96" class="s">digest match</text><text x="28" y="128" class="s">fail closed</text><text x="28" y="160" class="s">retain provenance</text></g><text x="600" y="230" class="h">→</text><g transform="translate(640 105)"><rect width="270" height="230" rx="26" fill="#102d55" stroke="#3b82f6" stroke-width="3"/><text x="30" y="58" class="h">Console Workbench</text><text x="30" y="106" class="s">inspect · filter · trace</text><text x="30" y="140" class="s">review markers · notes</text><text x="30" y="174" class="s">bounded visibility</text><text x="30" y="208" class="s">customer controlled</text></g><text x="930" y="230" class="h">→</text><g transform="translate(970 125)"><rect width="250" height="190" rx="24" fill="#4c1d95" stroke="#a855f7" stroke-width="2"/><text x="28" y="52" class="h">Human Review</text><text x="28" y="96" class="s">materiality context</text><text x="28" y="128" class="s">authorized decision</text><text x="28" y="160" class="s">outside Console</text></g><g transform="translate(60 390)"><rect width="1160" height="145" rx="24" fill="#0b1f2d" stroke="#ec4899" stroke-width="2"/><text x="32" y="48" class="h">Visibility is not authority.</text><text x="32" y="84" class="s">Guard owns its verdicts. Forge owns its product proposals. Console presents verified projections and review surfaces.</text><g transform="translate(32 104)"><rect width="150" height="28" rx="14" fill="#0d3b5f"/><text x="75" y="19" text-anchor="middle" class="b">DIGEST VERIFIED</text></g><g transform="translate(195 104)"><rect width="160" height="28" rx="14" fill="#0d3b5f"/><text x="80" y="19" text-anchor="middle" class="b">CUSTOMER HOSTED</text></g><g transform="translate(368 104)"><rect width="145" height="28" rx="14" fill="#0d3b5f"/><text x="72" y="19" text-anchor="middle" class="b">SOURCE PINNED</text></g><g transform="translate(526 104)"><rect width="175" height="28" rx="14" fill="#3a1530"/><text x="87" y="19" text-anchor="middle" class="b">NON-AUTHORITATIVE</text></g></g></svg>