<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="30" fill="#07172b"/><style>.h{font:800 28px Arial;fill:#fff}.s{font:500 17px Arial;fill:#dbeafe}.k{font:700 13px Arial;fill:#7dd3fc;letter-spacing:2px}.n{font:800 18px Arial;fill:#fff}</style><text x="55" y="60" class="k">IAAP FORGE · GOVERNED PRODUCT CONSTRUCTION</text><g transform="translate(55 110)"><rect width="190" height="170" rx="22" fill="#0d2438" stroke="#38bdf8"/><text x="24" y="48" class="h">Intent</text><text x="24" y="84" class="s">bounded order</text><text x="24" y="112" class="s">Guard evidence</text></g><text x="268" y="205" class="h">→</text><g transform="translate(305 110)"><rect width="190" height="170" rx="22" fill="#6d28d9" stroke="#a855f7"/><text x="24" y="48" class="h">Normalize</text><text x="24" y="84" class="s">stable initiative</text><text x="24" y="112" class="s">bounded AI proposal</text></g><text x="518" y="205" class="h">→</text><g transform="translate(555 110)"><rect width="190" height="170" rx="22" fill="#33240d" stroke="#f59e0b"/><text x="24" y="48" class="h">Gate</text><text x="24" y="84" class="s">schemas · policy</text><text x="24" y="112" class="s">tests · evidence</text></g><text x="768" y="205" class="h">→</text><g transform="translate(805 110)"><rect width="190" height="170" rx="22" fill="#123a24" stroke="#22c55e"/><text x="24" y="48" class="h">Approve</text><text x="24" y="84" class="s">authorized human</text><text x="24" y="112" class="s">exact bound change</text></g><text x="1018" y="205" class="h">→</text><g transform="translate(1055 110)"><rect width="100" height="170" rx="22" fill="#102d55" stroke="#3b82f6"/><text x="18" y="48" class="n">Product</text><text x="18" y="84" class="s">control</text><text x="18" y="112" class="s">plane</text></g><g transform="translate(55 350)"><rect width="1100" height="180" rx="24" fill="#0b1f2d" stroke="#ec4899"/><text x="34" y="52" class="h">Developers order the outcome. Forge builds the governed product behind it.</text><text x="34" y="98" class="s">Guard evidence is consumed, never rewritten and never treated as authorization.</text><text x="34" y="132" class="s">Composite AI proposes and explains. Deterministic controls decide admissibility. Authorized people approve.</text></g></svg>