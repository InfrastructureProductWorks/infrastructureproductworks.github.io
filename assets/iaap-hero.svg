<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc"><title id="title">AI-Powered Infrastructure as a Product</title><desc id="desc">Product-centered multi-cloud architecture showing experience, bounded AI, governance, stable contract, Crossplane, clouds and evidence.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".55" stop-color="#0b1730"/><stop offset="1" stop-color="#111827"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#22c55e" stop-opacity=".18"/><stop offset=".42" stop-color="#3ddcff" stop-opacity=".10"/><stop offset="1" stop-color="#0b1020" stop-opacity="0"/></radialGradient><linearGradient id="contract"><stop stop-color="#16a34a"/><stop offset="1" stop-color="#22c55e"/></linearGradient><linearGradient id="control"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><linearGradient id="ai"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#a855f7"/></linearGradient><style>.k{font:700 18px Arial;letter-spacing:3px;fill:#7dd3fc}.t{font:800 56px Arial;fill:#f8fafc}.tag{font:600 24px Arial;fill:#cbd5e1}.nt{font:800 21px Arial;fill:#f8fafc}.ns{font:500 14px Arial;fill:#dbeafe}.p{font:700 14px Arial;fill:#e2e8f0}.c{font:800 21px Arial;fill:#f8fafc}</style></defs><rect width="1600" height="760" rx="34" fill="url(#bg)"/><rect width="1600" height="760" rx="34" fill="url(#glow)"/><text x="80" y="72" class="k">INFRASTRUCTURE-AS-A-PRODUCT</text><text x="80" y="134" class="t">Build the product boundary first.</text><text x="80" y="178" class="tag">IaaS is what we buy; Infrastructure-as-a-Product is what we build.</text><g transform="translate(80 214)"><rect width="260" height="40" rx="20" fill="#0f2942" stroke="#38bdf8"/><text x="130" y="26" text-anchor="middle" class="p">EXPERIENCE — REPLACEABLE</text></g><g transform="translate(360 214)"><rect width="265" height="40" rx="20" fill="#23163a" stroke="#a855f7"/><text x="132" y="26" text-anchor="middle" class="p">INTELLIGENCE — BOUNDED</text></g><g transform="translate(645 214)"><rect width="255" height="40" rx="20" fill="#3b2a0d" stroke="#f59e0b"/><text x="127" y="26" text-anchor="middle" class="p">GOVERNANCE — TESTABLE</text></g><g transform="translate(920 214)"><rect width="265" height="40" rx="20" fill="#10341f" stroke="#22c55e"/><text x="132" y="26" text-anchor="middle" class="p">CONTRACT — STABLE</text></g><g transform="translate(1205 214)"><rect width="315" height="40" rx="20" fill="#10294b" stroke="#3b82f6"/><text x="157" y="26" text-anchor="middle" class="p">CONTROL PLANE — AUTHORITATIVE</text></g><g transform="translate(80 330)"><rect width="230" height="160" rx="24" fill="#0d2438" stroke="#38bdf8" stroke-width="2"/><text x="28" y="48" class="nt">Storefront</text><text x="28" y="80" class="ns">browse • configure</text><text x="28" y="106" class="ns">order • track</text><text x="28" y="132" class="ns">Backstage adapter / API</text></g><g transform="translate(365 330)"><rect width="245" height="160" rx="28" fill="url(#ai)"/><text x="28" y="48" class="nt">Composite AI</text><text x="28" y="80" class="ns">interpret intent</text><text x="28" y="106" class="ns">propose • explain</text><text x="28" y="132" class="ns">assemble evidence</text></g><g transform="translate(665 330)"><rect width="235" height="160" rx="28" fill="#33240d" stroke="#f59e0b" stroke-width="2"/><text x="28" y="48" class="nt">GitHub Governance</text><text x="28" y="80" class="ns">schema • policy • tests</text><text x="28" y="106" class="ns">human authorization</text><text x="28" y="132" class="ns">traceability • evidence</text></g><g transform="translate(960 330)"><rect width="245" height="160" rx="28" fill="url(#contract)"/><text x="28" y="48" class="nt">Product Contract</text><text x="28" y="80" class="ns">stable consumer API</text><text x="28" y="106" class="ns">outcomes, not topology</text></g><g transform="translate(1260 330)"><rect width="260" height="160" rx="28" fill="url(#control)"/><text x="28" y="48" class="nt">Crossplane</text><text x="28" y="80" class="ns">product control plane</text><text x="28" y="106" class="ns">continuous reconciliation</text><text x="28" y="132" class="ns">authoritative reconciler</text></g><g transform="translate(1080 570)"><rect width="120" height="58" rx="18" fill="#1f2937" stroke="#f59e0b"/><text x="60" y="36" text-anchor="middle" class="c">AWS</text></g><g transform="translate(1220 570)"><rect width="120" height="58" rx="18" fill="#1f2937" stroke="#38bdf8"/><text x="60" y="36" text-anchor="middle" class="c">Azure</text></g><g transform="translate(1360 570)"><rect width="120" height="58" rx="18" fill="#1f2937" stroke="#22c55e"/><text x="60" y="36" text-anchor="middle" class="c">GCP</text></g><g transform="translate(80 590)"><rect width="800" height="78" rx="22" fill="#0b1f2d" stroke="#ec4899"/><text x="34" y="34" class="nt">Portable by evidence, not by assertion.</text><text x="34" y="58" class="ns">change → validation → approval → reconciliation → status → evidence</text></g><text x="1520" y="714" text-anchor="end" class="ns">Infrastructure Product Works™ • reference architecture</text></svg>