<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc"><title id="title">Infrastructure-as-a-Product reference architecture</title><desc id="desc">Build the product boundary first: Storefront, bounded Composite AI, GitHub Governance, stable Product Contract, authoritative Crossplane, evidence and multicloud providers.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset=".55" stop-color="#08213b"/><stop offset="1" stop-color="#071728"/></linearGradient><linearGradient id="ai" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#a855f7"/></linearGradient><linearGradient id="contract" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#079447"/><stop offset="1" stop-color="#16c45d"/></linearGradient><linearGradient id="control" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087df1"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><style>.k{font:700 17px Arial,sans-serif;letter-spacing:4px;fill:#38bdf8}.title{font:800 58px Arial,sans-serif;fill:#f8fafc}.tag{font:600 23px Arial,sans-serif;fill:#e2e8f0}.pill{font:700 13px Arial,sans-serif;fill:#f8fafc}.ct{font:800 24px Arial,sans-serif;fill:#fff}.cs{font:500 17px Arial,sans-serif;fill:#e5eef8}.proof{font:800 27px Arial,sans-serif;fill:#f8fafc}.cloud{font:800 24px Arial,sans-serif;fill:#f8fafc}.foot{font:500 15px Arial,sans-serif;fill:#bae6fd}</style></defs><rect x="26" y="28" width="1548" height="764" rx="48" fill="url(#bg)" stroke="#1e6b94" stroke-width="2"/><rect x="54" y="58" width="1492" height="704" rx="34" fill="#07172b" opacity=".8"/><text x="100" y="108" class="k">INFRASTRUCTURE-AS-A-PRODUCT</text><text x="100" y="174" class="title">Build the product boundary first.</text><text x="100" y="220" class="tag">IaaS is what we buy; Infrastructure-as-a-Product is what we build.</text><g transform="translate(96 252)"><rect width="260" height="48" rx="24" fill="#092238" stroke="#0ea5e9" stroke-width="2"/><text x="130" y="30" text-anchor="middle" class="pill">EXPERIENCE — REPLACEABLE</text></g><g transform="translate(372 252)"><rect width="270" height="48" rx="24" fill="#211333" stroke="#a855f7" stroke-width="2"/><text x="135" y="30" text-anchor="middle" class="pill">INTELLIGENCE — BOUNDED</text></g><g transform="translate(658 252)"><rect width="270" height="48" rx="24" fill="#2d200b" stroke="#f59e0b" stroke-width="2"/><text x="135" y="30" text-anchor="middle" class="pill">GOVERNANCE — TESTABLE</text></g><g transform="translate(944 252)"><rect width="240" height="48" rx="24" fill="#082b1a" stroke="#22c55e" stroke-width="2"/><text x="120" y="30" text-anchor="middle" class="pill">CONTRACT — STABLE</text></g><g transform="translate(1200 252)"><rect width="304" height="48" rx="24" fill="#092442" stroke="#38bdf8" stroke-width="2"/><text x="152" y="30" text-anchor="middle" class="pill">CONTROL PLANE — AUTHORITATIVE</text></g><g transform="translate(96 336)"><rect width="260" height="244" rx="24" fill="#08223a" stroke="#22bdf2" stroke-width="2"/><text x="28" y="55" class="ct">Storefront</text><text x="28" y="105" class="cs">browse • configure</text><text x="28" y="140" class="cs">order • track</text><text x="28" y="175" class="cs">Backstage template / API</text></g><g transform="translate(372 336)"><rect width="270" height="244" rx="24" fill="url(#ai)" stroke="#c084fc" stroke-width="2"/><text x="28" y="55" class="ct">Composite AI</text><text x="28" y="105" class="cs">interpret intent</text><text x="28" y="140" class="cs">propose • explain</text><text x="28" y="175" class="cs">assemble evidence</text></g><g transform="translate(658 336)"><rect width="270" height="244" rx="24" fill="#33240d" stroke="#f59e0b" stroke-width="2"/><text x="28" y="55" class="ct">GitHub Governance</text><text x="28" y="105" class="cs">schemas • policy • tests</text><text x="28" y="140" class="cs">human authorization</text><text x="28" y="175" class="cs">traceability • evidence</text></g><g transform="translate(944 336)"><rect width="240" height="244" rx="24" fill="url(#contract)" stroke="#34d399" stroke-width="2"/><text x="28" y="55" class="ct">Product Contract</text><text x="28" y="105" class="cs">stable consumer API</text><text x="28" y="140" class="cs">outcomes, not topology</text></g><g transform="translate(1200 336)"><rect width="304" height="244" rx="24" fill="url(#control)" stroke="#38bdf8" stroke-width="2"/><text x="28" y="55" class="ct">Crossplane</text><text x="28" y="105" class="cs">product control plane</text><text x="28" y="140" class="cs">continuous reconciliation</text><text x="28" y="175" class="cs">authoritative reconciler</text></g><g transform="translate(96 626)"><rect width="870" height="108" rx="24" fill="#092035" stroke="#ec4899" stroke-width="2"/><text x="32" y="48" class="proof">Portable by evidence, not by assertion.</text><text x="32" y="80" class="cs">change → validation → approval → reconciliation → status → evidence</text></g><g transform="translate(1048 626)"><rect width="120" height="64" rx="18" fill="#17202d" stroke="#f59e0b" stroke-width="2"/><text x="60" y="40" text-anchor="middle" class="cloud">AWS</text></g><g transform="translate(1190 626)"><rect width="130" height="64" rx="18" fill="#17202d" stroke="#38bdf8" stroke-width="2"/><text x="65" y="40" text-anchor="middle" class="cloud">Azure</text></g><g transform="translate(1342 626)"><rect width="120" height="64" rx="18" fill="#17202d" stroke="#22c55e" stroke-width="2"/><text x="60" y="40" text-anchor="middle" class="cloud">GCP</text></g><text x="1462" y="730" text-anchor="end" class="foot">Infrastructure Product Works™ — reference architecture</text></svg>