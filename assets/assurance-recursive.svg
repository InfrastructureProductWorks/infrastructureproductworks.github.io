<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="30" fill="#07172b"/><style>.h{font:800 26px Arial;fill:#fff}.s{font:500 16px Arial;fill:#dbeafe}.k{font:700 13px Arial;fill:#7dd3fc;letter-spacing:2px}</style><text x="55" y="60" class="k">FRACTAL-RECURSIVE ASSURANCE</text><text x="55" y="105" class="h">Constraints narrow downward. Evidence aggregates upward.</text><g transform="translate(110 155)"><rect width="980" height="370" rx="28" fill="#0d2438" stroke="#8b5cf6" stroke-width="3"/><text x="35" y="50" class="h">Enterprise authority</text><g transform="translate(90 90)"><rect width="800" height="235" rx="25" fill="#102d55" stroke="#3b82f6" stroke-width="3"/><text x="30" y="48" class="h">Platform / tenant boundary</text><g transform="translate(100 80)"><rect width="600" height="115" rx="22" fill="#123a24" stroke="#22c55e" stroke-width="3"/><text x="28" y="46" class="h">Infrastructure product / resource</text><text x="28" y="80" class="s">same assurance pattern · narrower delegated authority</text></g></g></g><text x="80" y="575" class="s">↓ inherited constraints and bounded authority</text><text x="820" y="575" class="s">↑ fingerprints and evidence</text></svg>