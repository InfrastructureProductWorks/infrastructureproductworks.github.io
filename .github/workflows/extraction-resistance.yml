name: Extraction resistance gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extraction-resistance:
    name: extraction-resistance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Exercise synthetic public security regression cases
        run: python3 scripts/test_public_security_gates.py -v
      - name: Audit public exposure without removing portfolio content
        env:
          EXTRACTION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/audit_public_exposure.py
