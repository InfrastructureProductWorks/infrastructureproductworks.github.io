name: Verify public site

on:
  pull_request:
    paths:
      - index.html
      - operating-model/index.html
      - about/index.html
      - portfolio/index.html
      - terms/index.html
      - support/index.html
      - guard/index.html
      - console/index.html
      - assurance/index.html
      - docs/guard/index.html
      - assets/portfolio.js
      - .github/workflows/verify-public-site.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-portfolio-boundary:
    name: validate-portfolio-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate static portfolio boundary
        shell: bash
        run: |
          set -euo pipefail

          node --check assets/portfolio.js
          grep -Fq "IPW_PORTFOLIO_STATUS_BOUNDARY" assets/portfolio.js
          grep -Fq "independent-evidence-portfolio" assets/portfolio.js

          grep -Fq "Cloud resources are ingredients." index.html
          grep -Fq "What happens when teams use the suite?" index.html
          grep -Fq "organizations do not merely need another infrastructure automation tool." index.html
          grep -Fq "ADOPT WITHOUT REPLATFORMING" index.html
          grep -Fq "Illustrative annual planning scenarios for large regulated organizations" index.html
          grep -Fq "Evidence of capability, not a procurement request." index.html
          grep -Fq "not an official government product" index.html
          grep -Fq "not an official agency or department system" index.html
          grep -Fq "not a procurement proposal" index.html
          grep -Fq "not a commercial offer" index.html
          grep -Fq "Standard work is automated. Exceptional work is engineered. All work stays governed." index.html
          grep -Fq "Escape from automation, not from governance." index.html
          grep -Fq "Turn recurring exceptions into products." index.html
          grep -Fq "Leave the golden path without leaving the operating model." operating-model/index.html
          grep -Fq "Delegated fulfillment does not transfer lifecycle governance." operating-model/index.html
          grep -Fq "The current public proof does not yet implement automated non-standard request intake, routing, fulfillment or productization." operating-model/index.html

          grep -Fq "IPW is evidence of experience." about/index.html
          grep -Fq "The problem is bigger than provisioning." about/index.html
          grep -Fq "The work spans disciplines on purpose." about/index.html
          grep -Fq "not a request that any agency adopt, buy, license or operate a private product" about/index.html
          grep -Fq "Any public-sector version should be government-owned." about/index.html

          grep -Fq "without implying production, pilot, deployment, approval, commercialization or government authority" portfolio/index.html
          grep -Fq "Progress only matters if the evidence behind it is inspectable." portfolio/index.html
          grep -Fq "A green bar should mean something." portfolio/index.html
          grep -Fq "Public previews demonstrate product thinking" portfolio/index.html
          grep -Fq "do not establish operational readiness" portfolio/index.html
          grep -Fq "VALIDATION STAGES" portfolio/index.html
          grep -Fq "OWNER-CONTROLLED VALIDATION" portfolio/index.html

          grep -Fq "Portfolio Use Notice" terms/index.html
          grep -Fq "The portfolio is easiest to understand when evidence, demonstration and authority are kept separate." terms/index.html
          grep -Fq "not a commercial offer" terms/index.html
          grep -Fq "The website itself is not the adoption path" terms/index.html
          grep -Fq "Synthetic data only" terms/index.html

          grep -Fq "not production support, implementation support, procurement intake, consulting intake or an operational service desk" support/index.html
          grep -Fq "Questions should have a clear place to land without turning the portfolio into a service desk." support/index.html
          grep -Fq "This website is not an official channel" support/index.html

          grep -Fq "View public engineering surface" guard/index.html
          grep -Fq "Infrastructure can be valid code and still be the wrong architecture." guard/index.html
          grep -Fq "Guard is validated, not deployed." guard/index.html
          grep -Fq "WHAT THE PROOF DEMONSTRATES" guard/index.html

          grep -Fq "Review workspace proof, not production review service." console/index.html
          grep -Fq "Evidence can exist everywhere and still be hard to govern." console/index.html
          grep -Fq "no approval authority" console/index.html

          grep -Fq "Bounded proof, not production authority." assurance/index.html
          grep -Fq "Approval at the top is not enough if authority becomes ambiguous downstream." assurance/index.html
          grep -Fq "WHAT THE MODEL PRESERVES" assurance/index.html

          grep -Fq "Guard output supports review. It does not replace one." docs/guard/index.html
          grep -Fq "Guard sits between valid code and trusted change." docs/guard/index.html
          grep -Fq "not implementation support, production support, procurement guidance" docs/guard/index.html

          first_forbidden="IR"
          first_forbidden="${first_forbidden}S"
          second_forbidden="Treas"
          second_forbidden="${second_forbidden}ury"
          if grep -R -nE "${first_forbidden}|${second_forbidden}|Public Beta|commercial model|Pilot Ready|Customer-hosted / Pilot Ready|customer-facing intake|Get Support|What you actually get|Open IaaP Guard App|Problems we solve" \
            index.html operating-model/index.html about/index.html portfolio/index.html terms/index.html support/index.html guard/index.html console/index.html assurance/index.html docs/guard/index.html assets/portfolio.js; then
            echo "::error::Retired or named-organization wording found on tightened portfolio-boundary surfaces."
            exit 1
          fi

          if grep -nE "${first_forbidden}|${second_forbidden}" .github/workflows/verify-public-site.yml; then
            echo "::error::Named-organization wording found in workflow file."
            exit 1
          fi

          echo "Portfolio boundary posture validated."

  verify-public-site:
    name: verify-custom-domain
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed portfolio boundary on custom domain
        shell: bash
        env:
          BASE_URL: https://infrastructureproductworks.com
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          home=/tmp/index.html
          portfolio=/tmp/portfolio.html
          terms=/tmp/terms.html
          operating=/tmp/operating-model.html

          ok=0
          for attempt in $(seq 1 30); do
            echo "Attempt ${attempt}/30 for ${BASE_URL}/"
            home_code="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              --output "${home}" \
              --write-out '%{http_code}' \
              "${BASE_URL}/?verify=${EXPECTED_SHA}" || true)"
            portfolio_code="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              --output "${portfolio}" \
              --write-out '%{http_code}' \
              "${BASE_URL}/portfolio/?verify=${EXPECTED_SHA}" || true)"
            terms_code="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              --output "${terms}" \
              --write-out '%{http_code}' \
              "${BASE_URL}/terms/?verify=${EXPECTED_SHA}" || true)"
            operating_code="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              --output "${operating}" \
              --write-out '%{http_code}' \
              "${BASE_URL}/operating-model/?verify=${EXPECTED_SHA}" || true)"

            if [[ "${home_code}" == "200" && "${portfolio_code}" == "200" && "${terms_code}" == "200" && "${operating_code}" == "200" ]] \
              && grep -Fq 'Cloud resources are ingredients.' "${home}" \
              && grep -Fq 'What happens when teams use the suite?' "${home}" \
              && grep -Fq 'ADOPT WITHOUT REPLATFORMING' "${home}" \
              && grep -Fq 'Illustrative annual planning scenarios for large regulated organizations' "${home}" \
              && grep -Fq 'Evidence of capability, not a procurement request.' "${home}" \
              && grep -Fq 'not an official government product' "${home}" \
              && grep -Fq 'not an official agency or department system' "${home}" \
              && grep -Fq 'without implying production, pilot, deployment, approval, commercialization or government authority' "${portfolio}" \
              && grep -Fq 'Portfolio Use Notice' "${terms}" \
              && grep -Fq 'The website itself is not the adoption path' "${terms}" \
              && grep -Fq 'Standard work is automated. Exceptional work is engineered. All work stays governed.' "${home}" \
              && grep -Fq 'Leave the golden path without leaving the operating model.' "${operating}" \
              && grep -Fq 'Delegated fulfillment does not transfer lifecycle governance.' "${operating}" \
              && grep -Fq 'The current public proof does not yet implement automated non-standard request intake, routing, fulfillment or productization.' "${operating}"; then
              ok=1
              break
            fi

            sleep 10
          done

          if [[ "${ok}" != "1" ]]; then
            echo "::error::Custom-domain site did not publish expected portfolio-boundary wording."
            exit 1
          fi

          echo "Public deployment verified:"
          echo "  URL: ${BASE_URL}/"
          echo "  HTTP: 200"
          echo "  Portfolio boundary wording: present"
          echo "  Portfolio status boundary: present"
          echo "  Use notice boundary: present"
