name: Verify public site

on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.js'
      - '**/*.json'
      - '**/*.svg'
      - assets/portfolio.css
      - .github/workflows/verify-public-site.yml
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ethics-boundary:
    name: validate-ethics-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Keep public wording narrowly neutral
        shell: bash
        run: |
          set -euo pipefail

          forbidden_one="agen"
          forbidden_one="${forbidden_one}cy"
          forbidden_two="I"
          forbidden_two="${forbidden_two}RS"
          forbidden_three="Treas"
          forbidden_three="${forbidden_three}ury"

          if git grep -nEi "(^|[^[:alnum:]_])(${forbidden_one}|${forbidden_two}|${forbidden_three})([^[:alnum:]_]|$)" -- '*.html' '*.js' '*.json' '*.svg'; then
            echo "::error::Public website content contains employer- or agency-specific wording."
            exit 1
          fi

          grep -Fq "Cloud resources are ingredients." index.html
          grep -Fq "Cloud Infrastructure <span>Drive-Thru</span>" index.html
          grep -Fq "Same Great Clouds. A Better Way to Order." index.html
          grep -Fq "THE MISSING MIDDLE LAYER" index.html
          grep -Fq "Standard work is automated. Exceptional work is engineered. All work stays governed." index.html

          echo "Narrow ethics boundary and original homepage narrative validated."

  validate-portfolio-outlook:
    name: validate-portfolio-outlook
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript and forecast contract
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/portfolio.js
          grep -Fq "traceability-only-hidden-from-executive-view" assets/portfolio.js
          grep -Fq '"registeredMeasures": "traceability-only-hidden-from-executive-view"' data/roadmap-relationships.json
          grep -Fq "node('details','roadmap-objective')" assets/portfolio.js
          grep -Fq "node('details','roadmap-headline-kr')" assets/portfolio.js
          grep -Fq "roadmap-expand-all" portfolio/index.html
          grep -Fq "roadmap-collapse-all" portfolio/index.html
          grep -Fq "PORTFOLIO INQUIRY" support/index.html
          grep -Fq "PORTFOLIO USE NOTICE" terms/index.html
          grep -Fq "Organization-hosted concept. Synthetic validation. Non-authoritative." console/index.html
          grep -Fq "Open Synthetic Console Demo" console/index.html
          grep -Fq "IAAP CONSOLE · INTERACTIVE SYNTHETIC WORKBENCH" console/demo/index.html
          grep -Fq "VERIFICATION PENDING" console/demo/index.html
          grep -Fq "AWAITING_HUMAN_REVIEW" assets/console-demo.js
          grep -Fq "EXPECTED_DIGEST='2325359a4f6a7cc23bab39e5cfb7ff905192b98301ed3478392f218af19647eb'" assets/console-demo.js
          grep -Fq "DIGEST MISMATCH · FAIL CLOSED" assets/console-demo.js
          grep -Fq "Record Review Note" console/demo/index.html
          demo_js_blob="$(git hash-object assets/console-demo.js)"
          grep -Fq "/assets/console-demo.js?v=${demo_js_blob}" console/demo/index.html
          node --check assets/console-demo.js
          grep -Fq "Open Synthetic Assurance Demo" assurance/index.html
          grep -Fq "IAAP ASSURANCE · INTERACTIVE SYNTHETIC AUTHORITY GATE" assurance/demo/index.html
          grep -Fq "Expire Authority" assurance/demo/index.html
          grep -Fq "Broaden Scope" assurance/demo/index.html
          grep -Fq "Remove Approver" assurance/demo/index.html
          grep -Fq "Change Digest" assurance/demo/index.html
          grep -Fq "Fail Verification" assurance/demo/index.html
          grep -Fq "Sentry · Predeployment" assurance/demo/index.html
          grep -Fq "Protected Data Custody" assurance/demo/index.html
          grep -Fq "PROPOSED_PROFILE_PREVIEW" assurance/demo/index.html
          grep -Fq "GATE 6 · PROTECTED DATA CUSTODY" assurance/demo/index.html
          grep -Fq "SENTRY_PROFILE_STATUS='PROPOSED_PROFILE_PREVIEW'" assets/assurance-demo.js
          grep -Fq "PROTECTED_STORAGE_PUBLIC_ACCESS" assets/assurance-demo.js
          grep -Fq "DELEGATION_BROADENED" assets/assurance-demo.js
          grep -Fq "AUDIT_SUPPRESSION_ATTEMPT" assets/assurance-demo.js
          grep -Fq "GATE6_ENGINE_BUILD_DIGEST='sha256:065e43f824d78d7949c95465f9d7daa7623cf4322f2ec08e6d3b4c90b3be5995'" assets/assurance-demo.js
          grep -Fq "EXPECTED_AUTHORITY_DIGEST='sha256:31333df3a6e63e684ca4d75a33e4c0a3a59e547fe6a426e0a435878bbe4ccaa0'" assets/assurance-demo.js
          grep -Fq "APPROVAL_THRESHOLD_NOT_MET" assets/assurance-demo.js
          grep -Fq "AUTHORITY_REFERENCE_MISMATCH" assets/assurance-demo.js
          grep -Fq "authorityPackageRef:request.authority_package_ref" assets/assurance-demo.js
          grep -Fq "BLAST_RADIUS_EXCEEDED" assets/assurance-demo.js
          grep -Fq "OBSERVED_STATE_DIGEST_MISMATCH" assets/assurance-demo.js
          grep -Fq "VERIFICATION_FAILED_ROLLBACK_SUCCEEDED" assets/assurance-demo.js
          assurance_demo_js_blob="$(git hash-object assets/assurance-demo.js)"
          grep -Fq "/assets/assurance-demo.js?v=${assurance_demo_js_blob}" assurance/demo/index.html
          node --check assets/assurance-demo.js
          grep -Fq "Organization-hosted / Validation Ready" assets/portfolio.js
          if grep -R -nE "Public Beta|CUSTOMER-FACING INTAKE|Get Support|commercial model|commercial activation|Customer-hosted / Pilot Ready|SUPPORT REQUEST|Technical support|<option>Installation|Customer responsibility|<h3>Beta status</h3>" \
            support/index.html terms/index.html console/index.html portfolio/index.html assets/portfolio.js; then
            echo "::error::Retired business-facing wording found on surgically patched surfaces."
            exit 1
          fi
          grep -Fq "epicExternallyBlocked" assets/portfolio.js
          grep -Fq "forecastSignal" assets/portfolio.js
          grep -Fq "progressHistory" assets/portfolio.js
          grep -Fq "AUTO FORECAST" assets/portfolio.js
          js_blob="$(git hash-object assets/portfolio.js)"
          css_blob="$(git hash-object assets/portfolio.css)"
          grep -Fq "/assets/portfolio.js?v=${js_blob}" portfolio/index.html
          grep -Fq "/assets/portfolio.css?v=${css_blob}" portfolio/index.html
          if grep -Fq "Protected-main evidence" portfolio/index.html; then
            echo "::error::Portfolio must not claim protected-main evidence without verified protection."
            exit 1
          fi
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('data/roadmap-relationships.json','utf8'));
          const allowed=new Set([0,25,50,75,100]);
          if(data.schemaVersion!=='roadmap-relationship-view/v5') throw new Error('roadmap relationship schema');
          if(data.contributionSource!=='config/portfolio-strategic-kr-contributions.json'||!/^[0-9a-f]{40}$/.test(data.contributionBlobSha||'')) throw new Error('contribution contract provenance');
          if(data.relationshipModel?.epicContributionSemantics!=='relationship-specific-description-required') throw new Error('Epic contribution semantics');
          const krById=new Map((data.keyResults||[]).map(k=>[k.id,k]));
          const descriptionsByEpic=new Map();
          for(const strategic of data.headlineKeyResults||[]){
            if(strategic.objective!==String(strategic.id||'').split('-HKR',1)[0]) throw new Error(`Strategic KR Objective mismatch for ${strategic.id}`);
            if(!Array.isArray(strategic.epicContributions)||strategic.epicContributions.length<1) throw new Error(`missing Epic contributions for ${strategic.id}`);
            const derived=[...new Set(strategic.measures.flatMap(id=>(krById.get(id)||{epics:[]}).epics))];
            const declared=strategic.epicContributions.map(edge=>edge.epic);
            if(new Set(declared).size!==declared.length||derived.length!==declared.length||derived.some(id=>!declared.includes(id))) throw new Error(`Epic contribution coverage mismatch for ${strategic.id}`);
            for(const edge of strategic.epicContributions){
              if(typeof edge.description!=='string'||!edge.description.trim()) throw new Error(`missing contribution description for ${strategic.id}/${edge.epic}`);
              const entries=descriptionsByEpic.get(edge.epic)||[];
              entries.push(edge.description.trim().toLowerCase());
              descriptionsByEpic.set(edge.epic,entries);
            }
          }
          for(const [epic,entries] of descriptionsByEpic){
            if(entries.length>1&&new Set(entries).size!==entries.length) throw new Error(`duplicate multi-KR contribution description for ${epic}`);
          }
          if(data.forecastModel?.method!=='linear-evidence-trend/v1') throw new Error('forecastModel method');
          if(data.forecastModel.minimumSnapshots!==2||data.forecastModel.minimumSpanDays!==7) throw new Error('forecast bounds');
          if(data.forecastModel.blockedBehavior!=='no-date-inferred'||data.forecastModel.planningWindows!=='explicit-roadmap-assumptions') throw new Error('forecast semantics');
          if(!Array.isArray(data.progressHistory)||data.progressHistory.length<1) throw new Error('progressHistory missing');
          let prior='';
          for(const snapshot of data.progressHistory){
            if(!/^\d{4}-\d{2}-\d{2}$/.test(snapshot.date)||snapshot.date<=prior) throw new Error('history dates');
            if(snapshot.date>data.generatedAt) throw new Error('future history snapshot');
            const ids=Object.keys(snapshot.epics||{});
            if(ids.length<1||ids.some(id=>!/^EP-\d+$/.test(id))) throw new Error('history epic identifiers');
            if(ids.some(id=>!allowed.has(snapshot.epics[id]))) throw new Error('history completion scale');
            prior=snapshot.date;
          }
          const ep08=data.epics['EP-08'];
          if(!ep08||!/externally blocked|external prerequisite|customer-dependent/i.test(`${ep08.status||''} ${ep08.progress||''} ${ep08.progressBasis||''} ${ep08.time||''}`)) throw new Error('EP-08 external block contract');
          console.log('Portfolio forecast contract validated.');
          NODE

  verify-public-site:
    name: verify-custom-domain
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed portfolio on custom domain
        shell: bash
        env:
          BASE_URL: https://infrastructureproductworks.com
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          portfolio=/tmp/portfolio.html
          script=/tmp/portfolio.js
          stylesheet=/tmp/portfolio.css
          relationships=/tmp/roadmap-relationships.json
          console_demo=/tmp/console-demo.html
          console_demo_js=/tmp/console-demo.js
          assurance_demo=/tmp/assurance-demo.html
          assurance_demo_js=/tmp/assurance-demo.js
          js_blob="$(git hash-object assets/portfolio.js)"
          css_blob="$(git hash-object assets/portfolio.css)"
          relationships_blob="$(git hash-object data/roadmap-relationships.json)"
          console_demo_js_blob="$(git hash-object assets/console-demo.js)"
          console_demo_js_ref="/assets/console-demo.js?v=${console_demo_js_blob}"
          assurance_demo_js_blob="$(git hash-object assets/assurance-demo.js)"
          assurance_demo_js_ref="/assets/assurance-demo.js?v=${assurance_demo_js_blob}"
          js_ref="/assets/portfolio.js?v=${js_blob}"
          css_ref="/assets/portfolio.css?v=${css_blob}"

          ok=0
          for attempt in $(seq 1 30); do
            echo "Attempt ${attempt}/30 for ${BASE_URL}/portfolio/"
            code="$(curl --location --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              --output "${portfolio}" \
              --write-out '%{http_code}' \
              "${BASE_URL}/portfolio/?verify=${EXPECTED_SHA}" || true)"

            if [[ "${code}" == "200" ]] \
              && grep -Fq 'CONNECTED APPS UI QUALITY' "${portfolio}" \
              && grep -Fq 'BUILD → VALIDATE → EVIDENCE' "${portfolio}" \
              && grep -Fq 'DELIVERY OUTLOOK' "${portfolio}" \
              && grep -Fq 'delivery-outlook-grid' "${portfolio}" \
              && grep -Fq "${js_ref}" "${portfolio}" \
              && grep -Fq "${css_ref}" "${portfolio}"; then

              script_code="$(curl --location --silent --show-error \
                --connect-timeout 10 --max-time 20 \
                --output "${script}" \
                --write-out '%{http_code}' \
                "${BASE_URL}${js_ref}&verify=${EXPECTED_SHA}" || true)"
              css_code="$(curl --location --silent --show-error \
                --connect-timeout 10 --max-time 20 \
                --output "${stylesheet}" \
                --write-out '%{http_code}' \
                "${BASE_URL}${css_ref}&verify=${EXPECTED_SHA}" || true)"
              relationships_code="$(curl --location --silent --show-error \
                --connect-timeout 10 --max-time 20 \
                --output "${relationships}" \
                --write-out '%{http_code}' \
                "${BASE_URL}/data/roadmap-relationships.json?verify=${EXPECTED_SHA}" || true)"

              console_demo_code="$(curl --location --silent --show-error \
                --connect-timeout 10 --max-time 20 \
                --output "${console_demo}" \
                --write-out '%{http_code}' \
                "${BASE_URL}/console/demo/?verify=${EXPECTED_SHA}" || true)"
              console_demo_js_code="$(curl --location --silent --show-error \
                --connect-timeout 10 --max-time 20 \
                --output "${console_demo_js}" \
                --write-out '%{http_code}' \
                "${BASE_URL}${console_demo_js_ref}&verify=${EXPECTED_SHA}" || true)"

              assurance_demo_code="$(curl --location --silent --show-error \
                --connect-timeout 10 --max-time 20 \
                --output "${assurance_demo}" \
                --write-out '%{http_code}' \
                "${BASE_URL}/assurance/demo/?verify=${EXPECTED_SHA}" || true)"
              assurance_demo_js_code="$(curl --location --silent --show-error \
                --connect-timeout 10 --max-time 20 \
                --output "${assurance_demo_js}" \
                --write-out '%{http_code}' \
                "${BASE_URL}${assurance_demo_js_ref}&verify=${EXPECTED_SHA}" || true)"

              if [[ "${script_code}" == "200" && "${css_code}" == "200" && "${relationships_code}" == "200" && "${console_demo_code}" == "200" && "${console_demo_js_code}" == "200" && "${assurance_demo_code}" == "200" && "${assurance_demo_js_code}" == "200" ]] \
                && [[ "$(git hash-object "${script}")" == "${js_blob}" ]] \
                && [[ "$(git hash-object "${stylesheet}")" == "${css_blob}" ]] \
                && [[ "$(git hash-object "${relationships}")" == "${relationships_blob}" ]] \
                && [[ "$(git hash-object "${console_demo_js}")" == "${console_demo_js_blob}" ]] \
                && [[ "$(git hash-object "${assurance_demo_js}")" == "${assurance_demo_js_blob}" ]] \
                && grep -Fq 'IAAP CONSOLE · INTERACTIVE SYNTHETIC WORKBENCH' "${console_demo}" \
                && grep -Fq 'VERIFICATION PENDING' "${console_demo}" \
                && grep -Fq "${console_demo_js_ref}" "${console_demo}" \
                && grep -Fq 'AWAITING_HUMAN_REVIEW' "${console_demo_js}" \
                && grep -Fq 'EXPECTED_DIGEST=' "${console_demo_js}" \
                && grep -Fq 'IAAP ASSURANCE · INTERACTIVE SYNTHETIC AUTHORITY GATE' "${assurance_demo}" \
                && grep -Fq "${assurance_demo_js_ref}" "${assurance_demo}" \
                && grep -Fq "EXPECTED_AUTHORITY_DIGEST='sha256:31333df3a6e63e684ca4d75a33e4c0a3a59e547fe6a426e0a435878bbe4ccaa0'" "${assurance_demo_js}" \
                && grep -Fq 'VERIFICATION_FAILED_ROLLBACK_SUCCEEDED' "${assurance_demo_js}" \
                && grep -Fq 'AUTHORITY_REFERENCE_MISMATCH' "${assurance_demo_js}" \
                && grep -Fq 'Sentry · Predeployment' "${assurance_demo}" \
                && grep -Fq 'Protected Data Custody' "${assurance_demo}" \
                && grep -Fq "SENTRY_PROFILE_STATUS='PROPOSED_PROFILE_PREVIEW'" "${assurance_demo_js}" \
                && grep -Fq 'DELEGATION_BROADENED' "${assurance_demo_js}" \
                && grep -Fq 'AUDIT_SUPPRESSION_ATTEMPT' "${assurance_demo_js}" \
                && grep -Fq 'proof-pattern' "${script}" \
                && grep -Fq "['BUILD',p.state]" "${script}" \
                && grep -Fq "['VALIDATE',p.status]" "${script}" \
                && grep -Fq "['EVIDENCE',p.evidence]" "${script}" \
                && grep -Fq 'renderDeliveryOutlook' "${script}" \
                && grep -Fq 'DELIVERY_OUTLOOK_MILESTONES' "${script}" \
                && grep -Fq 'epicExternallyBlocked' "${script}" \
                && grep -Fq 'forecastSignal' "${script}" \
                && grep -Fq 'AUTO FORECAST' "${script}" \
                && grep -Fq 'strategicContributionMap' "${script}" \
                && grep -Fq 'CONTRIBUTION TO THIS KR' "${script}" \
                && grep -Fq 'roadmap-epic-contribution' "${stylesheet}" \
                && grep -Fq 'delivery-outlook-card' "${stylesheet}"; then
                ok=1
                break
              fi
            fi

            sleep 10
          done

          if [[ "${ok}" != "1" ]]; then
            echo "::error::Custom-domain portfolio did not publish the expected content-addressed dashboard assets."
            exit 1
          fi

          echo "Public deployment verified:"
          echo "  URL: ${BASE_URL}/portfolio/"
          echo "  HTTP: 200"
          echo "  Connected Apps validation panel: present"
          echo "  Build -> Validate -> Evidence product pattern: present"
          echo "  Delivery Outlook: history-backed forecast plumbing present"
          echo "  Roadmap relationships: exact v5 repository blob deployed"
