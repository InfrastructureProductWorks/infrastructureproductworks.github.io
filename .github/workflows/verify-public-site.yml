name: Verify public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-site:
    name: verify-custom-domain
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify deployed portfolio on custom domain
        shell: bash
        env:
          BASE_URL: https://infrastructureproductworks.com
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          portfolio=/tmp/portfolio.html
          script=/tmp/portfolio.js

          ok=0
          for attempt in $(seq 1 30); do
            echo "Attempt ${attempt}/30 for ${BASE_URL}/portfolio/"
            code="$(curl --location --silent --show-error               --connect-timeout 10 --max-time 20               --output "${portfolio}"               --write-out '%{http_code}'               "${BASE_URL}/portfolio/?verify=${EXPECTED_SHA}" || true)"

            if [[ "${code}" == "200" ]]               && grep -Fq 'CONNECTED APPS UI QUALITY' "${portfolio}"               && grep -Fq 'BUILD → VALIDATE → EVIDENCE' "${portfolio}" \
              && grep -Fq 'DELIVERY OUTLOOK' "${portfolio}" \
              && grep -Fq 'delivery-outlook-grid' "${portfolio}"; then
              ok=1
              break
            fi

            sleep 10
          done

          if [[ "${ok}" != "1" ]]; then
            echo "::error::Custom-domain portfolio did not publish the expected dashboard markers."
            exit 1
          fi

          curl --location --fail --silent --show-error             --connect-timeout 10 --max-time 20             "${BASE_URL}/assets/portfolio.js?verify=${EXPECTED_SHA}"             --output "${script}"

          grep -Fq 'proof-pattern' "${script}"
          grep -Fq "['BUILD',p.state]" "${script}"
          grep -Fq "['VALIDATE',p.status]" "${script}"
          grep -Fq "['EVIDENCE',p.evidence]" "${script}"
          grep -Fq 'renderDeliveryOutlook' "${script}"
          grep -Fq 'DELIVERY_OUTLOOK_MILESTONES' "${script}"

          echo "Public deployment verified:"
          echo "  URL: ${BASE_URL}/portfolio/"
          echo "  HTTP: 200"
          echo "  Connected Apps validation panel: present"
          echo "  Build -> Validate -> Evidence product pattern: present"
          echo "  Delivery Outlook: present"
