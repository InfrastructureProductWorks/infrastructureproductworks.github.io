name: Verify Assurance record views
on:
  pull_request:
    paths:
      - 'assets/assurance*'
      - 'assurance/**'
      - 'scripts/*assurance*'
      - '.github/workflows/verify-assurance-records.yml'
  push:
    branches: [main]
    paths:
      - 'assets/assurance*'
      - 'assurance/**'
      - 'scripts/*assurance*'
      - '.github/workflows/verify-assurance-records.yml'
permissions:
  contents: read
jobs:
  verify-records:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reproduce and verify source records
        run: |
          node scripts/build_assurance_records.cjs --check
          node scripts/test_assurance_records.cjs
      - name: Install browser test dependencies
        run: |
          npm install --prefix /tmp/assurance-test playwright@1.62.1
          /tmp/assurance-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise record workflow in browser
        env:
          PLAYWRIGHT_MODULE: /tmp/assurance-test/node_modules/playwright
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/assurance-server.log 2>&1 &
          node scripts/test_assurance_browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assurance-browser-evidence
          path: /tmp/assurance-ui/
