name: Verify inquiry contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inquiry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - run: node scripts/build_inquiry_contract.mjs
      - run: npm test --prefix webhook
