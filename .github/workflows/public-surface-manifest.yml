name: Public surface manifest gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-surface-manifest:
    name: public-surface-manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify intentional public surface inventory
        run: python3 scripts/audit_public_surface.py
