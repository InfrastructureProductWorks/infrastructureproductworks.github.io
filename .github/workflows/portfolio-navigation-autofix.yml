name: Portfolio Navigation Autofix

on:
  push:
    branches:
      - feature/portfolio-navigation
    paths:
      - scripts/add_portfolio_nav.py
      - .github/workflows/portfolio-navigation-autofix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/portfolio-navigation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update site navigation
        run: python scripts/add_portfolio_nav.py
      - name: Commit generated navigation changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No navigation changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Portfolio Status to site navigation"
          git push origin HEAD:feature/portfolio-navigation
